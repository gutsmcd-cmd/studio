name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unpack uploaded bundle (one-time)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          if [ -f b64/done ]; then
            cat b64/repo.part* | base64 -d > /tmp/repo.tgz
            echo "$(cat b64/sha256)  /tmp/repo.tgz" | sha256sum -c -
            tar -xzf /tmp/repo.tgz
            git rm -r -q b64
            git add -A && git commit -m "Unpack uploaded site files" && git push origin HEAD:main
          fi
      - name: Publish site to gh-pages
        run: |
          set -e
          mkdir /tmp/out && rsync -a --exclude .git --exclude .github --exclude b64 ./ /tmp/out/ && cd /tmp/out && touch .nojekyll
          git init -q -b gh-pages && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898333+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages:gh-pages
